<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Shop</title>
  </head>
  <body class="body">
    <div class="wrapper">
      <header class="header">
        <a class="logo" href="#">
          <img src="./img/Logo.svg" alt="#" />
        </a>
        <nav class="menu">
          <a href="#">Home</a>
          <a href="#">Shop</a>
          <a href="#">Plant Care</a>
          <a href="#">Blogs</a>
        </nav>
        <button class="enter" type="button">Login</button>
      </header>
      <main>
        <section class="sectionblocks">
          <div class="block1">
            <p class="smalltext">welcome to greenshop</p>
            <h1 class="title">
              Let's make a better <span class="green">planet</span>
            </h1>
            <p class="bigtext">
              We are an online plant shop offering a wide range of cheap and
              trendy plants. Use our plants to create an unique Urban
              Jungle.Order your favorite plants!
            </p>
            <button class="buttonshop" type="button">shop now</button>
          </div>
          <div class="block2">
            <img src="./img/Flowers.svg" alt="#" />
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
